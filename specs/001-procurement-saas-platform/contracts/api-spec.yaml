            type: string
            format: uuid
      responses:
        '200':
          description: List of chats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chat'

    post:
      tags:
        - Chats
      summary: Create chat
      description: Creates a new chat conversation in the project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'

  /chats/{chatId}/messages:
    get:
      tags:
        - Messages
      summary: List messages in chat
      description: Returns messages in chronological order
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Messages
      summary: Send message to chat
      description: Sends user message and triggers AI agent orchestration
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  example: "Preciso de um ETP para 500 carteiras escolares"
      responses:
        '201':
          description: Message created, AI processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /chats/{chatId}/generate/stream:
    get:
      tags:
        - Messages
      summary: Stream AI document generation
      description: Server-Sent Events endpoint for real-time AI generation updates
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE stream of generation events
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [status, content, complete, error]
                  agent:
                    type: string
                    enum: [RESEARCHER, VALIDATOR, WRITER, REVIEWER]
                  content:
                    type: string
                  error:
                    type: string
              examples:
                status:
                  value:
                    type: status
                    agent: RESEARCHER
                    message: "Searching Brazilian procurement laws"
                content:
                  value:
                    type: content
                    content: "# Estudo Técnico Preliminar\n\n"
                complete:
                  value:
                    type: complete
                    documentId: "123e4567-e89b-12d3-a456-426614174000"

  /attachments/upload:
    post:
      tags:
        - Attachments
      summary: Upload file attachment
      description: Uploads file for chat context (max 10MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - projectId
              properties:
                file:
                  type: string
                  format: binary
                projectId:
                  type: string
                  format: uuid
                messageId:
                  type: string
                  format: uuid
                  description: Optional message to attach file to
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '413':
          description: File too large (max 10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /attachments/{attachmentId}/download:
    get:
      tags:
        - Attachments
      summary: Download attachment
      description: Downloads the file content
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Attachment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
